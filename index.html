<!DOCTYPE html>
<html lang="vi">
<head>
<script>
(function(){var K='tp_cfg',last=0,nextT=0,noThink=false;function cfg(){try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return{}}}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function b64(b){return new Promise(function(r){var f=new FileReader();f.onload=function(){r(f.result.split(',')[1])};f.readAsDataURL(b)})}
function err(m,c){var e=new Error(m);e.code=c;return e}
async function sample(prompt,opts){opts=opts||{};var c=cfg();if(!c.key)throw err('Chưa nhập API key. Bấm ⚙️ ở góc trên để nhập.','no_key');
var prov=c.prov||'gemini',imgs=[];for(var im of(opts.images||[]))imgs.push(await b64(im));
var alt=false;for(var at=0;at<4;at++){var r,j;
if(prov==='gemini'){var tt=Math.max(Date.now(),nextT);nextT=tt+3500;if(tt>Date.now())await sleep(tt-Date.now());
var model=alt?'gemini-flash-latest':((c.model&&c.model!=='gemini-2.5-flash')?c.model:'gemini-3.8-flash'),parts=imgs.map(function(d){return{inline_data:{mime_type:'image/jpeg',data:d}}});parts.push({text:prompt});
var gc={maxOutputTokens:8192,temperature:0.7,responseMimeType:'application/json'};if(/2\.5-flash/.test(model))gc.thinkingConfig={thinkingBudget:0};else if(!noThink)gc.thinkingConfig={thinkingLevel:'low'};
r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(c.key),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contents:[{role:'user',parts:parts}],generationConfig:gc})});
j=await r.json().catch(function(){return{}});
if(r.ok){var cd=(j.candidates||[])[0],t=cd&&cd.content&&cd.content.parts?cd.content.parts.map(function(x){return x.text||''}).join(''):'';if(!t)throw err('AI không trả về nội dung'+(cd&&cd.finishReason?' ('+cd.finishReason+')':'')+'. Thử lại nhé.','empty');return{text:t}}}
else{var content=imgs.map(function(d){return{type:'image',source:{type:'base64',media_type:'image/jpeg',data:d}}});content.push({type:'text',text:prompt});
r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:c.model||'claude-sonnet-4-6',max_tokens:6000,messages:[{role:'user',content:content}]})});
j=await r.json().catch(function(){return{}});
if(r.ok)return{text:(j.content||[]).map(function(x){return x.text||''}).join('')}}
if(prov==='gemini'&&!r.ok&&gc.thinkingConfig&&!noThink&&/thinking/i.test(JSON.stringify(j))){noThink=true;continue}
if(prov==='gemini'&&!r.ok&&!alt&&/no longer available|NOT_FOUND|not found/i.test(JSON.stringify(j))){alt=true;continue}
if((r.status===429||r.status===503)&&at<3){await sleep(15000);continue}
if(r.status===429)throw err('Đã hết lượt miễn phí (giới hạn theo phút hoặc theo ngày). Chờ vài phút hoặc đến ngày mai rồi thử lại.','api_429');
throw err((j.error&&j.error.message)||('Lỗi HTTP '+r.status),'api_'+r.status)}}
sample.limits=async function(){return{images:true}};
window.claude={use:async function(n){if(n==='sample')return sample;throw new Error('unavailable')}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});})();
</script>
<script src="config.js"></script>
<script>
window.__KEY=localStorage.getItem('tp_uid')?'tp_data_'+localStorage.getItem('tp_uid'):'toeic_fc_v1';
var FB=window.TP_FIREBASE||{},fbOK=!!(FB.apiKey&&FB.projectId);
function authed(){return !!localStorage.getItem('tp_auth')&&!!localStorage.getItem('tp_uid')}
function idb(){return new Promise(function(res,rej){var r=indexedDB.open('tp_db',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function idbGet(k){return idb().then(function(db){return new Promise(function(res,rej){var t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=function(){res(t.result)};t.onerror=function(){rej(t.error)}})})}
function idbSet(k,v){return idb().then(function(db){return new Promise(function(res,rej){var t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=function(){rej(t.error)}})})}
function idbDel(k){return idb().then(function(db){return new Promise(function(res,rej){var t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=res;t.onerror=function(){rej(t.error)}})})}
function warn(t){var b=document.getElementById('warnb');if(!b){b=document.createElement('div');b.id='warnb';b.style.cssText='position:fixed;left:0;right:0;top:0;z-index:70;background:#d64545;color:#fff;padding:10px 14px;font-size:14px;text-align:center;cursor:pointer';b.onclick=function(){b.remove()};document.body.appendChild(b)}b.textContent=t}
var pT=null;
async function flush(){try{await idbSet(window.__KEY,JSON.parse(JSON.stringify(S)));try{localStorage.removeItem(window.__KEY)}catch(e){}}catch(e){try{localStorage.setItem(window.__KEY,JSON.stringify(S))}catch(e2){warn('⚠️ Không lưu được dữ liệu (bộ nhớ đầy). Hãy bấm ⚙️ → Xuất dữ liệu để sao lưu ngay. Chạm để ẩn.')}}}
function persist(){clearTimeout(pT);pT=setTimeout(flush,300)}
document.addEventListener('visibilitychange',function(){try{if(document.hidden){clearTimeout(pT);flush()}}catch(e){}});
function viErr(m){m=String(m||'');var t={EMAIL_EXISTS:'Email này đã được đăng ký.',INVALID_EMAIL:'Email không hợp lệ.',INVALID_LOGIN_CREDENTIALS:'Sai email hoặc mật khẩu.',EMAIL_NOT_FOUND:'Không có tài khoản với email này.',INVALID_PASSWORD:'Sai mật khẩu.',MISSING_PASSWORD:'Chưa nhập mật khẩu.',OPERATION_NOT_ALLOWED:'Chưa bật đăng nhập Email/Password trong Firebase.',CONFIGURATION_NOT_FOUND:'Chưa bật Authentication trong Firebase.',USER_DISABLED:'Tài khoản đã bị khoá.',API_KEY_INVALID:'apiKey trong config.js không đúng.'};for(var k in t)if(m.indexOf(k)>=0)return t[k];if(m.indexOf('WEAK_PASSWORD')>=0)return 'Mật khẩu cần ít nhất 6 ký tự.';if(m.indexOf('TOO_MANY')>=0)return 'Thử quá nhiều lần, chờ vài phút rồi thử lại.';return 'Lỗi: '+m}
async function authCall(ep,body){var r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:'+ep+'?key='+encodeURIComponent(FB.apiKey),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});var j=await r.json().catch(function(){return{}});if(!r.ok)throw new Error(viErr(j.error&&j.error.message));return j}
async function token(){var a=JSON.parse(localStorage.getItem('tp_auth')||'null');if(!a)throw new Error('Chưa đăng nhập');if(a.exp-60000>Date.now())return a.idToken;
var r=await fetch('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(FB.apiKey),{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(a.refreshToken)});var j=await r.json().catch(function(){return{}});
if(!r.ok)throw new Error('Phiên đăng nhập hết hạn, hãy đăng nhập lại.');a.idToken=j.id_token;a.refreshToken=j.refresh_token;a.exp=Date.now()+(+j.expires_in)*1000;localStorage.setItem('tp_auth',JSON.stringify(a));return a.idToken}
async function fsReq(m,path,body){var t=await token();var r=await fetch('https://firestore.googleapis.com/v1/projects/'+encodeURIComponent(FB.projectId)+'/databases/(default)/documents'+path,{method:m,headers:{'content-type':'application/json',authorization:'Bearer '+t},body:body?JSON.stringify(body):undefined});var j=await r.json().catch(function(){return{}});if(!r.ok)throw new Error((j.error&&j.error.message)||('HTTP '+r.status));return j}
function makeDB(uid){return{doc:function(p){var id=p.split('/').pop();return{set:async function(o){await fsReq('PATCH','/users/'+uid+'/docs/'+encodeURIComponent(id)+'?updateMask.fieldPaths=json',{fields:{json:{stringValue:JSON.stringify(o)}}})}}},
collection:function(){return{get:async function(){var docs=[],pt='';do{var j=await fsReq('GET','/users/'+uid+'/docs?pageSize=100'+(pt?'&pageToken='+encodeURIComponent(pt):''));(j.documents||[]).forEach(function(d){docs.push({id:decodeURIComponent(d.name.split('/').pop()),data:function(){try{return JSON.parse(d.fields.json.stringValue)}catch(e){return null}}})});pt=j.nextPageToken||''}while(pt);return{docs:docs}}}}}}
(function(){var old=window.claude.use;window.claude.use=async function(n){if(n==='db'){if(!(fbOK&&authed()))throw new Error('guest');return makeDB(localStorage.getItem('tp_uid'))}if(n==='user'){if(!authed())throw new Error('guest');return{id:async function(){return localStorage.getItem('tp_uid')}}}return old(n)}})();
async function finishLogin(j){var uid=j.localId;localStorage.setItem('tp_auth',JSON.stringify({email:j.email,uid:uid,idToken:j.idToken,refreshToken:j.refreshToken,exp:Date.now()+(+j.expiresIn)*1000}));
var ak='tp_data_'+uid,have=null;try{have=await idbGet(ak)}catch(e){}
if(!have){var g=null;try{g=await idbGet('toeic_fc_v1')}catch(e){}if(!g){try{var r=localStorage.getItem('toeic_fc_v1');if(r)g=JSON.parse(r)}catch(e){}}
if(g&&g.days&&g.days.length){var n=g.days.reduce(function(a,d){return a+d.words.length},0);if(confirm('Máy này đang có '+n+' từ chưa gắn tài khoản. Gộp vào tài khoản này?'))try{await idbSet(ak,g)}catch(e){}}}
localStorage.setItem('tp_uid',uid);localStorage.removeItem('tp_guest');location.reload()}
function showGate(){var o=document.createElement('div');o.id='gate';o.style.cssText='position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,#1b1464,#0f0c29 55%,#24243e);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto';
o.innerHTML="<div class='card' style='width:100%;max-width:380px'><div style='text-align:center'><img src='icon-192.png' alt='' style='width:76px;height:76px;border-radius:50%;box-shadow:0 0 22px #8b4fe0aa'><h1 style='margin:8px 0 2px'>Thế Phong TOEIC</h1><p class='mu' style='margin:0 0 12px'>Đăng nhập để đồng bộ kho từ giữa các thiết bị</p></div><input class='in' id='ge' type='email' placeholder='Email' autocomplete='username'><input class='in' id='gp' type='password' placeholder='Mật khẩu (từ 6 ký tự)' autocomplete='current-password'><div class='row' style='margin-top:6px'><button class='btn pri' id='gi' style='flex:1'>Đăng nhập</button><button class='btn' id='gu' style='flex:1'>Đăng ký</button></div><p class='mu' id='gm' style='min-height:20px'></p><div class='row' style='justify-content:space-between'><button class='btn' id='gf'>Quên mật khẩu</button><button class='btn' id='gg'>Dùng không tài khoản</button></div></div>";
document.body.appendChild(o);var q=function(x){return o.querySelector(x)},m=function(t){q('#gm').textContent=t};
async function go(kind){var e=q('#ge').value.trim(),pw=q('#gp').value;if(!e||!pw)return m('Nhập email và mật khẩu.');m('Đang xử lý…');try{await finishLogin(await authCall(kind==='up'?'signUp':'signInWithPassword',{email:e,password:pw,returnSecureToken:true}))}catch(x){m(x.message)}}
q('#gi').onclick=function(){go('in')};q('#gu').onclick=function(){go('up')};
q('#gf').onclick=async function(){var e=q('#ge').value.trim();if(!e)return m('Nhập email trước.');try{await authCall('sendOobCode',{requestType:'PASSWORD_RESET',email:e});m('Đã gửi email đặt lại mật khẩu (xem cả hộp thư rác).')}catch(x){m(x.message)}};
q('#gg').onclick=function(){localStorage.setItem('tp_guest','1');o.remove();runApp()}}
function runApp(){document.querySelectorAll('script[type="text/app"]').forEach(function(el){var s=document.createElement('script');s.textContent=el.textContent;document.body.appendChild(s);s.remove()})}
async function boot(){var S0=null;try{S0=await idbGet(window.__KEY)}catch(e){}
if(!S0){try{var r=localStorage.getItem(window.__KEY);if(r)S0=JSON.parse(r)}catch(e){}}
window.__boot={S:S0};try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if(fbOK&&!authed()&&!localStorage.getItem('tp_guest')){showGate();return}runApp()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>

<style>
:root{--bg:#f6f5f1;--sf:#fff;--tx:#1d1d1b;--mu:#6b6b66;--bd:#e2e0d8;--ac:#2f6fed;--ok:#1f9d55;--no:#d64545;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161617;--sf:#222224;--tx:#efeee9;--mu:#9a9a94;--bd:#38383b;--ac:#6b9bff;--ok:#4cc27f;--no:#f07070;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:12px 16px 40px}
h1{font-size:20px;margin:8px 0 12px}
nav{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
nav button,.btn{border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:9px 14px;border-radius:10px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on,.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:12px}
.mu{color:var(--mu);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=number],textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px}
textarea{width:100%;min-height:80px}
.big{font-size:32px;font-weight:700;margin:0}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);margin-right:4px}
.fc{min-height:260px;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.back h3{margin:12px 0 2px;font-size:13px;color:var(--mu);font-weight:600;text-transform:uppercase}
.back p{margin:0}
.act{display:flex;gap:10px}.act .btn{flex:1;padding:14px;font-weight:600}
.no{color:var(--no)}.ok{color:var(--ok)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{height:70px;border-radius:8px;border:1px solid var(--bd)}
.w{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.bar{height:8px;background:var(--bg);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
:root,:root:not([data-theme="light"]){--bg:#0f0c29;--sf:rgba(255,255,255,.08);--bd:rgba(255,255,255,.14);--tx:#f4f3ff;--mu:#a9a6d6;--ac:#8b7bff;--ok:#3ddc97;--no:#ff6b8b;color-scheme:dark}
body{background:linear-gradient(160deg,#1b1464,#0f0c29 55%,#24243e) fixed;min-height:100vh}
h1{font-size:22px;background:linear-gradient(90deg,#fff,#c9b8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn.pri{background:linear-gradient(90deg,#6f5bff,#d85fb0);border:0;font-weight:600}
nav button.on{background:linear-gradient(90deg,#6f5bff,#d85fb0);border:0}
.hud{display:flex;align-items:center;gap:8px;margin-bottom:12px}.chip{padding:4px 10px;border-radius:99px;background:var(--sf);border:1px solid var(--bd);font-size:14px;font-weight:600;white-space:nowrap}
.xp{flex:1;height:10px;border-radius:9px;background:var(--sf);overflow:hidden}.xp i{display:block;height:100%;background:linear-gradient(90deg,#ffd166,#ff6b8b);transition:width .5s}
.prog{height:6px;border-radius:9px;background:var(--sf);overflow:hidden;margin-bottom:6px}.prog i{display:block;height:100%;background:linear-gradient(90deg,#3ddc97,#5ad1ff);transition:width .4s}
.scene{perspective:1200px;margin:8px 0 14px}
.fcc{position:relative;min-height:440px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.fcc.in{animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}.fcc.flipped{transform:rotateY(180deg)}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:22px;display:flex;flex-direction:column;justify-content:center;overflow:auto;border:1px solid var(--bd)}
.front{background:linear-gradient(145deg,#4b3fd8,#8b4fe0 60%,#d85fb0);box-shadow:0 20px 50px -15px #8b4fe0cc}
.backf{background:#1c1750;transform:rotateY(180deg);justify-content:flex-start;box-shadow:0 20px 50px -15px #000}
.desc{font-size:22px;line-height:1.45;font-weight:600;margin:16px 0}.hint{letter-spacing:3px;font-size:20px;opacity:.9;margin:0}.tap{margin-top:auto;padding-top:20px;font-size:14px;opacity:.85;text-align:center}
.combo{font-weight:700;color:#ffd166}
.act .btn{border-radius:16px;font-size:17px}.act .btn.ok{background:var(--ok);color:#06281b;border-color:transparent}.act .btn.no{background:rgba(255,107,139,.15);border-color:var(--no);color:var(--no)}.act .btn:active{transform:scale(.96)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translateX(-50%);background:linear-gradient(90deg,#ffd166,#ff6b8b);color:#2a1030;padding:10px 18px;border-radius:99px;font-weight:700;z-index:20}
.brand{display:flex;align-items:center;gap:12px;margin:6px 0 12px}.brand h1{margin:0}.logo{width:46px;height:46px;border-radius:50%;box-shadow:0 0 18px #8b4fe0aa;flex:none}
#splash{position:fixed;inset:0;background:#0f0c29;display:flex;align-items:center;justify-content:center;z-index:50;transition:opacity .6s}#splash img{width:min(62vw,300px);border-radius:32px;animation:pop .7s cubic-bezier(.2,.9,.3,1.2)}
.emo{font-size:64px;line-height:1.1;text-align:center;margin:8px 0}.front .desc{font-size:18px;margin:8px 0}.gr{margin:8px 0;background:rgba(0,0,0,.28);border-radius:12px;padding:8px 12px;font-size:14px}.gr summary{cursor:pointer;font-weight:600}.gr p{margin:8px 0 0;line-height:1.45}.lvs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.lvs label{cursor:pointer;padding:5px 10px}
.fcc{min-height:560px}.front{justify-content:flex-start}.pic{display:block;width:100%;max-width:300px;height:auto;margin:6px auto;border-radius:16px;background:#fff}.gr{background:rgba(0,0,0,.3)}.gr b{display:block;margin-bottom:2px}.gr p{margin:8px 0 0}
.in{display:block;width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px;margin-bottom:6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:30;overflow:auto;padding:16px}.ovc{max-width:520px;margin:12px auto;background:#1c1750}
.tk{cursor:pointer;border-radius:4px}.tk:hover{background:rgba(139,123,255,.35)}
.en{font-size:18px;line-height:1.75;margin:0 0 8px}.vi{margin:0;line-height:1.5}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:58vh;overflow:auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:15}.sheet .card{margin:0;background:#1c1750;border-color:#8b7bff}.sheet h3{margin:10px 0 2px;font-size:12px;color:var(--mu);text-transform:uppercase}.sheet p{margin:0}.sheet code{background:rgba(255,255,255,.1);padding:2px 6px;border-radius:6px}
#sbtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:16;box-shadow:0 8px 24px #0008}#art{padding-bottom:45vh}
.hud .chip[data-go]{color:inherit;cursor:pointer;font:inherit;font-weight:600}
.dtog{align-self:flex-start;background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;margin:2px 0 6px}.dvi{margin:0 0 8px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.28);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
.lp{margin-top:26vh}.lpn{margin:10px 0 0;padding:6px 10px;border-radius:10px;background:rgba(255,209,102,.14);color:#ffd166;font-size:13px}
.fw{font-size:30px;font-weight:700;margin:6px 0 0}.front .tk{border-bottom:1px dotted rgba(255,255,255,.55)}
.seg{display:flex;gap:4px;margin:6px 0 10px}.seg span{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}.seg i{display:block;height:100%;background:linear-gradient(90deg,#3ddc97,#5ad1ff)}
.rw{background:rgba(255,107,139,.12);border-radius:8px;padding:6px 8px}.no{color:var(--no)}.hud{flex-wrap:wrap;row-gap:6px}.xp{min-width:60px}
</style>
</head>

let S={days:[],prog:{}},tab="add",draft=null,files=[],busy="",q=[],qi=0,flip=false,mode="",selDay=0,sampleP=null;
if(window.__boot&&window.__boot.S)S=window.__boot.S;S.days=S.days||[];S.prog=S.prog||{};

const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const key=w=>w.word.toLowerCase().trim();
const allUpTo=d=>S.days.filter(x=>x.day<=d).flatMap(x=>x.words);

function nav(){const t=[["add","Thêm từ"],["new","Học từ mới"],["rev","Tổng ôn"],["read","Đọc"],["st","Tiến độ"]];
$("#nav").innerHTML=t.map(([k,n])=>`<button class="${tab==k?"on":""}" data-k="${k}">${n}</button>`).join("");
$("#nav").onclick=e=>{const k=e.target.dataset.k;if(k){tab=k;q=[];render()}}}
function render(){nav();({add:vAdd,new:()=>vStudy("new"),rev:()=>vStudy("rev"),st:vStats})[tab]()}
function shrink(f){return new Promise(res=>{const im=new Image();im.onload=()=>{const m=1600,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*r;c.height=im.height*r;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(res,"image/jpeg",.85)};im.src=URL.createObjectURL(f)})}
function parseJ(t){const m=String(t).match(/\[[\s\S]*\]/);if(!m)throw new Error("Không đọc được kết quả");return JSON.parse(m[0])}
function vAdd(){
const next=(S.days.length?Math.max(...S.days.map(d=>d.day)):0)+1;
$("#v").innerHTML=`<div class="card"><b>Gửi ảnh chứa từ vựng</b><p class="mu">Chọn 1 hoặc nhiều ảnh (chụp sách, bảng, danh sách từ…). App sẽ đọc các từ tiếng Anh và tạo flashcard đầy đủ IPA, từ loại, CEFR, nghĩa, cụm từ hữu ích, ví dụ.</p>

<p class="mu" id="msg">${esc(busy)}</p></div>
<div class="card"><b>✨ Để mình chọn từ cho bạn</b><p class="mu">Chọn cấp độ, chủ đề và số lượng. App gợi ý từ mới (không trùng từ bạn đã có) rồi tạo flashcard. Ngày lưu lấy theo ô “Lưu vào ngày” ở trên.</p><div class="lvs">${["A1","A2","B1","B2","C1","C2"].map(l=>`<label class="tag"><input type="checkbox" class="lv" value="${l}" ${l==="B1"||l==="B2"?"checked":""}> ${l}</label>`).join("")}</div><div class="row" style="margin-top:10px"><select id="tp"><option value="random">🎲 Ngẫu nhiên</option>${topicOpts(false)}</select><span>Số từ</span><input id="cn" type="number" min="1" max="40" value="10" style="width:80px"><button class="btn pri" id="au">Gợi ý từ</button></div></div>${(()=>{const n=S.days.flatMap(d=>d.words).filter(c=>!c.desc||!c.gram||!c.descVi||!c.phr||c.min).length;return n?`<div class="card"><b>🔄 Nâng cấp thẻ cũ</b><p class="mu">${n} thẻ chưa có mô tả, bản dịch hoặc phân tích ngữ pháp. Bấm để app tạo bổ sung (giữ nguyên các thông tin cũ).</p><button class="btn pri" id="up">Nâng cấp ${n} thẻ</button></div>`:""})()}<div id="pv"></div>`;

function boom(el){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,cols=["#3ddc97","#ffd166","#8b7bff","#ff6b8b","#5ad1ff"];for(let i=0;i<24;i++){const p=document.createElement("i");p.style.cssText=`position:fixed;left:${cx}px;top:${cy}px;width:8px;height:8px;border-radius:2px;background:${cols[i%5]};z-index:9;pointer-events:none`;document.body.appendChild(p);const a=Math.random()*6.28,d=80+Math.random()*130;p.animate([{transform:"translate(0,0)",opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+60}px) rotate(${Math.random()*540}deg) scale(.4)`,opacity:0}],{duration:800+Math.random()*400,easing:"cubic-bezier(.2,.8,.4,1)"}).onfinish=()=>p.remove()}}

else{const c=q[qi],blank=(c.ex||"").replace(new RegExp(rx(c.word),"ig"),"_____"),desc=c.desc||"Thẻ cũ chưa có mô tả. Vào tab “Thêm từ” → “Nâng cấp thẻ cũ” để tạo mô tả, hình minh hoạ và phân tích ngữ pháp.",hint=c.word.split("").map((ch,i)=>i===0||ch===" "?ch:"_").join(" ");

<script type="text/app">
let DB=null,UID=null,tm=null;const pushed={};
function docs(){const o={meta:{xp:S.xp||0,streak:S.streak||0,last:S.last||"",day:S.day||null,prog:S.prog}};S.days.forEach(d=>o["day-"+d.day]={day:d.day,words:d.words});return o}

function merge(snap){let ch=false;for(const d of snap.docs){const r=d.data();if(!r)continue;
if(d.id==="meta"){const lt=Date.parse(S.last)||0,rt=Date.parse(r.last)||0;
if((r.xp||0)>(S.xp||0)){S.xp=r.xp;ch=true}
if(rt>lt||(rt===lt&&(r.streak||0)>(S.streak||0))){S.last=r.last;S.streak=r.streak;S.day=r.day||S.day;ch=true}else if(rt===lt&&r.day&&S.day&&r.day.d===S.day.d&&r.day.n>S.day.n){S.day=r.day;ch=true}
for(const k in(r.prog||{})){const a=S.prog[k],b=r.prog[k];if(!a||(b.u||0)>(a.u||0)){S.prog[k]=b;ch=true}}}
else if(d.id.startsWith("day-")){let D=S.days.find(x=>x.day===r.day);if(!D){D={day:r.day,words:[]};S.days.push(D);ch=true}
for(const w of r.words||[]){const e=D.words.find(x=>key(x)===key(w));if(!e){D.words.push(w);ch=true}else["emo","svg","desc","descVi","gram"].forEach(k=>{if(w[k]&&!e[k]){e[k]=w[k];ch=true}})}}}

function vStats(){const all=S.days.flatMap(d=>d.words),n=all.length,known=all.filter(c=>stOf(c)==='yes').length,red=all.filter(c=>(S.prog[key(c)]||{}).k===0).length,due=all.filter(c=>Date.now()>=((S.prog[key(c)]||{}).due||0)).length,dups=countDups();
$('#v').innerHTML=`<div class='card'><b>${S.days.length} ngày · ${n} từ</b><p class='mu'>✅ Thuộc: ${known} · ❌ Chưa thuộc: <span class='no'>${red}</span> · Cần ôn hôm nay: ${due}</p><div class='bar'><i style='width:${n?known/n*100:0}%'></i></div></div><div class='card'><div class='row' style='flex-wrap:nowrap'><input class='in' id='sq' type='search' placeholder='🔎 Tìm từ hoặc nghĩa…' value='${ea(qs)}' style='margin:0;flex:1;min-width:0'><button class='btn pri' id='ad'>＋ Thêm từ</button></div><div class='row' style='margin-top:8px'><select id='sf'><option value='all'>Tất cả từ</option><option value='no'>❌ Chưa thuộc</option><option value='yes'>✅ Thuộc</option><option value='new'>⚪ Chưa học</option></select>${dups?`<button class='btn' id='dd'>🔗 Gộp ${dups} từ trùng</button>`:''}</div></div><div id='wl'></div><p class='mu'>Từ màu đỏ là từ bạn đã bấm “Chưa thuộc”. Dữ liệu đồng bộ giữa các thiết bị đăng nhập cùng tài khoản.</p>`;
$('#sf').value=sfil;$('#sf').onchange=e=>{sfil=e.target.value;wlist()};
$('#sq').oninput=e=>{qs=e.target.value;wlist()};$('#ad').onclick=()=>edit(null);
if($('#dd'))$('#dd').onclick=()=>{if(confirm('Gộp các từ trùng hoặc cùng gốc (ví dụ “run” và “run out”) thành một thẻ nhiều nghĩa?')){const k=dedupeAll();save();toast(`Đã gộp ${k} từ`);vStats()}};
$('#wl').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.e!=null){const c=S.days.flatMap(d=>d.words).find(c=>key(c)===b.dataset.e);if(c)edit(c)}else if(b.dataset.x!=null){const k=b.dataset.x;if(delArm===k)delWord(k);else{delArm=k;wlist();setTimeout(()=>{if(delArm===k){delArm=null;if($('#wl'))wlist()}},3000)}}};
wlist();hud()}
function wlist(){const t=qs.trim().toLowerCase();
const h=S.days.map(d=>{const L=dayLv(d),ws=d.words.filter(c=>{const p=S.prog[key(c)],k=p?p.k:undefined;if(sfil==='no'&&k!==0)return false;if(sfil==='yes'&&k!==1)return false;if(sfil==='new'&&k!==undefined)return false;return !t||(c.word+' '+(c.vi||'')).toLowerCase().includes(t)});if(!ws.length)return'';
return `<div class='card'><div class='row' style='justify-content:space-between;flex-wrap:nowrap'><span><b>Ngày ${d.day}</b> <span class='mu'>(${ws.length}/${d.words.length} từ)</span></span><span class='mu'>Lv ${L.lv}/5 · ${LVN[L.lv]}</span></div>${seg(L.mean)}${ws.map(c=>{const p=S.prog[key(c)],red=p&&p.k===0,k=ea(key(c));return `<div class='w ${red?'rw':''}'><span><b class='${red?'no':''}'>${red?'● ':''}${esc(c.word)}</b>${c.more&&c.more.length?` <span class='tag'>+${c.more.length}</span>`:''} <span class='mu'>${esc(c.vi)}</span></span><span class='row' style='flex-wrap:nowrap'><span class='tag'>${esc(c.cefr)}</span><button class='btn' data-e='${k}'>✏️</button><button class='btn' data-x='${k}'>${delArm===key(c)?'Xoá?':'🗑'}</button></span></div>`}).join('')}</div>`}).join('');
$('#wl').innerHTML=h||`<div class='card'>Không tìm thấy từ nào.</div>`}
/* --- sửa / thêm từ --- */
const p2s=a=>(a||[]).map(x=>x.en+' = '+x.vi).join('; '),s2p=t=>t.split(';').map(x=>x.trim()).filter(Boolean).map(x=>{const i=x.indexOf('=');return i<0?{en:x,vi:''}:{en:x.slice(0,i).trim(),vi:x.slice(i+1).trim()}});
const m2s=a=>(a||[]).map(x=>x.p+' = '+x.vi).join('; ');
function edit(c){const f=[['word','Từ'],['ipa','Phiên âm'],['pos','Từ loại'],['cefr','CEFR'],['vi','Nghĩa tiếng Việt'],['desc','Mô tả mặt trước (EN)'],['descVi','Bản dịch mô tả (VI)'],['ex','Ví dụ (EN)'],['exVi','Ví dụ (VI)'],['pron','Mẹo phát âm']],isNew=!c;c=c||{};
const o=document.createElement('div');o.className='ov';
o.innerHTML=`<div class='card ovc'><b>${isNew?'Thêm từ mới':'Sửa từ'}</b>${f.map(([k,l])=>`<label class='mu'>${l}</label><input class='in' data-k='${k}' value='${ea(c[k]||'')}'>`).join('')}<label class='mu'>Cụm từ hữu ích (dạng: cụm = nghĩa; cụm = nghĩa)</label><input class='in' data-k='phr' value='${ea(p2s(c.phr))}'><label class='mu'>Nghĩa / cụm khác (dạng: cụm = nghĩa; …)</label><input class='in' data-k='more' value='${ea(m2s(c.more))}'>${isNew?`<label class='mu'>Lưu vào ngày</label><input class='in' id='ed' type='number' value='${S.days.length?S.days[S.days.length-1].day:1}'>`:''}<p class='mu' id='em'></p><div class='row'><button class='btn pri' id='eok'>Lưu</button><button class='btn' id='eno'>Huỷ</button></div></div>`;
document.body.appendChild(o);$('#eno').onclick=()=>o.remove();
$('#eok').onclick=()=>{const v={};o.querySelectorAll('[data-k]').forEach(i=>v[i.dataset.k]=i.value.trim());
if(!v.word)return $('#em').textContent='Cần nhập từ.';
v.phr=v.phr?s2p(v.phr):[];const old=c.more||[];v.more=(v.more||'').split(';').map(x=>x.trim()).filter(Boolean).map(x=>{const i=x.indexOf('='),p=(i<0?x:x.slice(0,i)).trim(),vi=i<0?'':x.slice(i+1).trim(),e=old.find(m=>m.p.toLowerCase()===p.toLowerCase())||{};return Object.assign({},e,{p,vi})});
if(isNew){const day=+$('#ed').value||1;let D=S.days.find(x=>x.day===day);if(!D){D={day,words:[]};S.days.push(D);S.days.sort((a,b)=>a.day-b.day)}
const r=addCard(D,v);if(r!=='new')toast(r==='dup'?'Từ đã có, đã bổ sung phần còn thiếu':'Đã gộp vào từ cùng gốc')}
else{const ok=key(c);Object.assign(c,v);delete c.min;c.u=Date.now();const nk=key(c);if(nk!==ok){if(S.prog[ok]){S.prog[nk]=S.prog[ok];delete S.prog[ok]}S.del['w:'+ok]=Date.now()}}
save();o.remove();vStats()}}
/* --- giải phóng bộ nhớ --- */
function freeUI(box){if(!box)return;const kb=n=>Math.max(1,Math.round(n/1024))+' KB',js=o=>JSON.stringify(o===undefined?'':o).length;
const words=S.days.flatMap(d=>d.words),svgSz=words.reduce((a,c)=>a+(c.svg?c.svg.length:0)+(c.emo?c.emo.length:0),0),live=new Set(words.map(key)),orph=Object.keys(S.prog).filter(k=>!live.has(k)),old=S.reads.filter(a=>Date.now()-a.date>30*864e5),readSz=js(S.reads);
const items=[{n:'Hình minh hoạ cũ (SVG/emoji, không còn hiển thị)',sz:svgSz,id:'f1',btn:'Xoá hình cũ',on:svgSz>0},{n:`Bài đọc (${S.reads.length} bài)`,sz:readSz,id:'f2',btn:`Xoá bài cũ hơn 30 ngày (${old.length})`,on:old.length>0,id2:'f2b',btn2:'Xoá tất cả bài',on2:S.reads.length>0},{n:`Tiến độ của từ đã xoá (${orph.length} mục)`,sz:js(orph.map(k=>S.prog[k])),id:'f3',btn:'Dọn',on:orph.length>0}];
const big=items.slice().sort((a,b)=>b.sz-a.sz)[0];
box.innerHTML=`<p class='mu'>${big.sz>1024?`Đề xuất: bắt đầu từ “${esc(big.n)}” (${kb(big.sz)}). `:'Dữ liệu của bạn đang rất nhẹ. '}Nên bấm “Xuất dữ liệu” để sao lưu trước khi xoá.</p>`+items.map(i=>`<div class='w'><span>${esc(i.n)}<br><span class='mu'>${kb(i.sz)}</span></span><span class='row' style='flex-wrap:nowrap'>${i.on?`<button class='btn' id='${i.id}'>${esc(i.btn)}</button>`:''}${i.on2?`<button class='btn' id='${i.id2}'>${esc(i.btn2)}</button>`:''}</span></div>`).join('')+`<div class='w'><span>Bộ nhớ đệm của app (cache)<br><span class='mu'>Tải lại tự động lần sau</span></span><button class='btn' id='f4'>Xoá cache</button></div>`;
const done=m=>{save();toast(m);freeUI(box)};
const b=(id,fn)=>{const e=box.querySelector('#'+id);if(e)e.onclick=fn};
b('f1',()=>{if(confirm('Xoá hình minh hoạ cũ của tất cả thẻ?')){words.forEach(c=>{if(c.svg||c.emo){delete c.svg;delete c.emo;c.u=Date.now()}});done('Đã xoá hình cũ')}});
b('f2',()=>{if(confirm('Xoá các bài đọc cũ hơn 30 ngày?')){old.forEach(a=>{S.del['r:'+a.id]=Date.now()});S.reads=S.reads.filter(a=>!old.includes(a));done('Đã xoá bài đọc cũ')}});
b('f2b',()=>{if(confirm('Xoá TẤT CẢ bài đọc?')){S.reads.forEach(a=>{S.del['r:'+a.id]=Date.now()});S.reads=[];done('Đã xoá tất cả bài đọc')}});
b('f3',()=>{orph.forEach(k=>delete S.prog[k]);done('Đã dọn tiến độ thừa')});
b('f4',async()=>{try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));toast('Đã xoá cache')}catch(e){toast('Không xoá được cache')}})}
</script>
<script type="text/app">
(function(){var K='tp_cfg',get=function(){try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return{}}},DM={gemini:'gemini-3.8-flash',anthropic:'claude-sonnet-4-6'};
var b=document.createElement('button');b.className='chip';b.textContent='⚙️';b.title='Cài đặt';b.style.cssText='margin-left:auto;cursor:pointer;color:inherit;font:inherit;font-size:18px';document.querySelector('.brand').appendChild(b);
try{var lb=+localStorage.getItem('tp_lastbk')||0;if(!lb)localStorage.setItem('tp_lastbk',Date.now());else if(!authed()&&S.days.length&&Date.now()-lb>7*864e5)warn('📦 Đã hơn 7 ngày chưa sao lưu. Bấm ⚙️ → Xuất dữ liệu. Chạm để ẩn.')}catch(e){}
function openSettings(showGuide){var c=get(),pv=c.prov||'gemini',o=document.createElement('div');o.className='ov';
var acc=!fbOK?"<p class='mu'>Chưa cấu hình tài khoản (điền file config.js để bật đăng nhập).</p>":authed()?"<p class='mu'>Đang đăng nhập: <b>"+ea((JSON.parse(localStorage.getItem('tp_auth')||'{}')).email||'')+"</b><br>Dữ liệu tự đồng bộ giữa các thiết bị đăng nhập cùng tài khoản.</p><button class='btn' id='clo'>Đăng xuất</button>":"<p class='mu'>Đang dùng không tài khoản (dữ liệu chỉ nằm trên máy này).</p><button class='btn pri' id='cli'>Đăng nhập / Đăng ký</button>";
o.innerHTML="<div class='card ovc'><b>👤 Tài khoản</b>"+acc+"<hr style='border-color:var(--bd);margin:14px 0'><b>⚙️ Cài đặt AI</b><label class='mu'>Nhà cung cấp</label><select class='in' id='cp'><option value='gemini'"+(pv==='gemini'?' selected':'')+">Google Gemini (có gói miễn phí)</option><option value='anthropic'"+(pv==='anthropic'?' selected':'')+">Anthropic Claude (trả phí)</option></select><label class='mu'>API key (chỉ lưu trên máy này, không đồng bộ)</label><input class='in' id='ck' type='password' placeholder='AIza… hoặc sk-ant-…' value='"+ea(c.key||'')+"'><p class='mu' id='chint'></p><details id='cg'><summary class='mu' style='cursor:pointer'>📖 Hướng dẫn lấy API key</summary><div id='cgb' class='mu' style='margin:6px 0 10px'></div></details><label class='mu'>Model</label><input class='in' id='cm' value='"+ea((c.model&&c.model!=='gemini-2.5-flash')?c.model:DM[pv])+"'><div class='row'><button class='btn pri' id='cs'>Lưu</button><button class='btn' id='cx'>Đóng</button></div><hr style='border-color:var(--bd);margin:14px 0'><b>💾 Bộ nhớ trên máy này</b><p class='mu' id='cst'>Đang kiểm tra…</p><div class='bar'><i id='cbar' style='width:0'></i></div><hr style='border-color:var(--bd);margin:14px 0'><b>🧹 Giải phóng bộ nhớ</b><div id='cfree'></div><hr style='border-color:var(--bd);margin:14px 0'><b>Sao lưu / chuyển máy</b><p class='mu'>Xuất file rồi nhập vào máy khác. Nhập sẽ gộp với dữ liệu đang có.</p><div class='row'><button class='btn' id='ce'>⬇️ Xuất dữ liệu</button><label class='btn'>⬆️ Nhập dữ liệu<input id='ci' type='file' accept='.json' hidden></label></div><p class='mu' id='cmsg'></p></div>";
document.body.appendChild(o);var q=function(x){return o.querySelector(x)},m=function(t){q('#cmsg').textContent=t};
var G="<ol style='margin:0;padding-left:20px;line-height:1.7'><li>Bấm nút bên dưới để mở trang lấy key (đăng nhập tài khoản Google).</li><li>Bấm <b>Create API key</b> (nếu được hỏi chọn project, chọn project có sẵn hoặc cho tạo mới).</li><li>Bấm biểu tượng <b>copy</b> để chép key (dạng <b>AIza…</b>).</li><li>Quay lại đây, <b>dán vào ô API key</b> ở trên rồi bấm <b>Lưu</b>.</li></ol><a class='btn pri' href='https://aistudio.google.com/app/apikey' target='_blank' rel='noopener' style='display:inline-block;margin-top:8px'>🔑 Mở trang lấy API key</a><p style='margin:8px 0 0'>Lưu ý: gói miễn phí có giới hạn lượt dùng theo phút và theo ngày. Mỗi thiết bị nhập key một lần. Đừng chia sẻ key cho người khác. Nếu trang yêu cầu nhập thẻ hoặc bật thanh toán thì dừng lại, bạn không cần làm bước đó.</p>",A="<ol style='margin:0;padding-left:20px;line-height:1.7'><li>Bấm nút bên dưới, đăng nhập console.anthropic.com.</li><li>Nạp trước một ít tiền ở mục <b>Billing</b> (Claude API tính phí theo lượng dùng).</li><li>Vào <b>API Keys → Create Key</b>, copy key (dạng <b>sk-ant-…</b>).</li><li>Quay lại đây, dán vào ô API key rồi bấm <b>Lưu</b>.</li></ol><a class='btn pri' href='https://console.anthropic.com/settings/keys' target='_blank' rel='noopener' style='display:inline-block;margin-top:8px'>🔑 Mở trang lấy API key</a>";var hint=function(){var g=q('#cp').value==='gemini';q('#chint').textContent=g?'Dùng Gemini: có gói miễn phí, chỉ cần tài khoản Google.':'Dùng Claude: cần nạp tiền, tính theo lượng dùng.';q('#cgb').innerHTML=g?G:A};hint();if(showGuide)q('#cg').open=true;
q('#cp').onchange=function(){var v=q('#cp').value;if(q('#cm').value===DM.gemini||q('#cm').value==='gemini-2.5-flash'||q('#cm').value===DM.anthropic)q('#cm').value=DM[v];hint()};
q('#cx').onclick=function(){o.remove()};freeUI(q('#cfree'));
q('#cs').onclick=function(){var v=q('#cp').value;localStorage.setItem(K,JSON.stringify({prov:v,key:q('#ck').value.trim(),model:q('#cm').value.trim()||DM[v]}));m('Đã lưu.')};
if(q('#cli'))q('#cli').onclick=function(){localStorage.removeItem('tp_guest');location.reload()};
if(q('#clo'))q('#clo').onclick=async function(){try{await push()}catch(e){}if(syncSt!=='☁️'&&!confirm('Dữ liệu có thể chưa đồng bộ xong. Vẫn đăng xuất và xoá dữ liệu trên máy này?'))return;var uid=localStorage.getItem('tp_uid');try{await idbDel('tp_data_'+uid)}catch(e){}localStorage.removeItem('tp_data_'+uid);localStorage.removeItem('tp_auth');localStorage.removeItem('tp_uid');location.reload()};
var n=S.days.reduce(function(a,d){return a+d.words.length},0);
if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(function(e){var mb=function(x){return (x/1048576).toFixed(1)};q('#cst').textContent=n+' từ · đã dùng '+mb(e.usage)+' MB / khoảng '+Math.round(e.quota/1048576)+' MB cho phép';q('#cbar').style.width=Math.max(1,Math.min(100,e.usage/e.quota*100))+'%';if(navigator.storage.persisted)navigator.storage.persisted().then(function(p){q('#cst').textContent+=p?' · đã được trình duyệt giữ bền':' · chưa được giữ bền (nên cài app lên máy)'})}).catch(function(){q('#cst').textContent=n+' từ'});else q('#cst').textContent=n+' từ';
q('#ce').onclick=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(docs())],{type:'application/json'}));a.download='thephong-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();localStorage.setItem('tp_lastbk',Date.now());m('Đã xuất file.')};
q('#ci').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);merge({docs:Object.keys(d).map(function(id){return{id:id,data:function(){return d[id]}}})});save();render();m('Đã nhập và gộp dữ liệu.')}catch(x){m('File không hợp lệ.')}};r.readAsText(f)}}
b.onclick=function(){openSettings()};
var _r=render;render=function(){_r();try{var c=get(),v=document.getElementById('v');if(!c.key&&v&&(tab==='add'||(tab==='read'&&!rid))){var d=document.createElement('div');d.className='card';d.innerHTML="<b>🔑 Cần API key để dùng AI</b><p class='mu'>Tạo thẻ, gợi ý từ, bài đọc và phân tích ngữ pháp cần API key Gemini miễn phí. Lấy mất khoảng 1 phút.</p><button class='btn pri' id='kg'>Xem hướng dẫn lấy key</button>";v.insertBefore(d,v.firstChild);d.querySelector('#kg').onclick=function(){openSettings(true)}}}catch(e){}};
render();
})();
</script>
